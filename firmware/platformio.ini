[platformio]
default_envs = m5stack-stopwatch

[env:m5stack-stopwatch]
platform = espressif32 @ 6.12.0
board = esp32s3box
framework = arduino
monitor_speed = 115200
board_build.partitions = anna_partitions.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.arduino.memory_type = qio_opi
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DWEBSOCKETS_MAX_DATA_SIZE=4096
    -DWEBSOCKETS_TCP_TIMEOUT=1500
    -DWEBSOCKETS_NETWORK_TYPE=10
    -DNODEBUG_WEBSOCKETS
lib_extra_dirs = vendor
lib_deps =
    https://github.com/m5stack/M5GFX.git#0.2.26
    https://github.com/m5stack/M5Unified.git#4fb444784c85791e0b0207701392b42be234b2e7


[env:m5stack-stopwatch-zh]
extends = env:m5stack-stopwatch
build_flags = ${env:m5stack-stopwatch.build_flags} -DANNA_LANG_ZH

[env:m5stack-stopwatch-ja]
extends = env:m5stack-stopwatch
build_flags = ${env:m5stack-stopwatch.build_flags} -DANNA_LANG_JA
